
name: Deployment of the frontend

on: 
    push: 
        branches: [ main ]

jobs:
    build: 
        runs-on: ubuntu-latest
        steps:
            # This step checks out (downloads) the repository code onto the GitHub Actions runner so that subsequent steps have access to the codebase.
            - name: Checkout the code
              uses: actions/checkout@v2

            # Docker Login: Authenticates this GitHub Action with Docker Hub using your credentials.
            - name: Docker Login
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            # Set up Docker Buildx: Enables advanced Docker build features such as multi-platform builds and caching.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            # Build and push Docker image: Builds your Docker image and pushes it to Docker Hub so it can be deployed or pulled elsewhere.
            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                context: .
                file: ./docker/Dockerfile.frontend
                build-args: |
                  DATABASE_URL=${{ secrets.DATABASE_URL }}
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-frontend:${{ github.sha }}
              
            - run: |
               echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
                     chmod 700 /home/runner/ssh_key
                     ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@16.171.231.129 
                     -t "docker stop todo_frontend || true &&
                         docker rm todo_frontend|| true &&
                         docker run --name todo_frontend -d -p 3000:3000 100xdevs/todo-app-frontend:${{ github.sha }}"
             
          